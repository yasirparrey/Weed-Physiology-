# Models that show up on "best open source LLM" lists but do not ship weights,
# or ship them under terms that are not open. Listed so the omission is explicit.
excluded:
  - name: Qwen3.5-Max / 3.6-Max / 3.7-Max
    reason: >
      API-only. Every Qwen Max generation before 3.8 stayed closed; Qwen3.8 broke
      that pattern, so the 2.4T-A95B checkpoint IS included above. Trackers that
      still list Qwen3.8 Max as proprietary are stale - the weights went up on
      ModelScope on 2026-08-12.
  - name: Inkling (full)
    reason: >
      975B/41B. Thinking Machines' own comparison table places Inkling in the
      closed-weights group; only Inkling-Small (276B/12B) is Apache 2.0.
  - name: Gemini 3.1 Pro / Claude Opus 4.6 / GPT-5.6
    reason: Closed weights. Included in some tables above only as reference points.
