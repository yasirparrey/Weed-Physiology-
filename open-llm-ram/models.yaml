# Open-weight LLM database: parameters, architecture, and memory characteristics.
#
# Every model here ships downloadable weights. Closed/API-only models are excluded
# even when they appear on "open source" marketing leaderboards (see EXCLUDED at
# the bottom of this file for the notable near-misses).
#
# Field notes
# -----------
# total_params_b   Total parameters in billions. This is what has to fit in memory.
# active_params_b  Parameters touched per token. This drives speed, NOT memory.
# checkpoint_gb    Measured on-disk size of the official checkpoint, when a
#                  first-party or directly-measured figure exists. Overrides the
#                  computed weight size for the `native` precision scenario.
# arch.kv.source   How the KV-cache geometry was obtained:
#                    config     - read off the published config.json / model card
#                    documented - stated in a vendor or vendor-adjacent write-up
#                    estimated  - inferred from the attention family and scale.
#                                 Treat these as +/- 50%, not as ground truth.

meta:
  as_of: 2026-08-27
  notes: >
    Parameter counts and active-parameter shares are cross-checked against the
    LLM Architecture Gallery active-parameter table, vendor model cards, and
    Hugging Face configs. Where sources disagree (GLM-5.2 is the worst case:
    744B official vs 753B on NVIDIA's card vs 743B computed by vLLM) the value
    used here is noted per model.

sources:
  arch_gallery: https://sebastianraschka.com/llm-architecture-gallery/active-parameter-ratio/
  kimi_k3_paper: https://arxiv.org/abs/2607.24653
  kimi_k3_sizing: https://particula.tech/blog/self-host-kimi-k3-gpu-sizing-mxfp4-vllm
  deepseek_v4_card: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash
  glm52_blog: https://huggingface.co/blog/zai-org/glm-52-blog
  qwen35_card: https://huggingface.co/Qwen/Qwen3.5-397B-A17B
  minimax_m3: https://github.com/MiniMax-AI/MiniMax-M3
  mimo_v25_pro: https://huggingface.co/XiaomiMiMo/MiMo-V2.5-Pro
  hy3: https://github.com/Tencent-Hunyuan/Hy3
  inkling_small: https://thinkingmachines.ai/model-card/inkling-small/
  nemotron3_ultra: https://docs.api.nvidia.com/nim/reference/nvidia-nemotron-3-ultra-550b-a55b
  thunder_compute: https://www.thundercompute.com/blog/best-open-source-llms

